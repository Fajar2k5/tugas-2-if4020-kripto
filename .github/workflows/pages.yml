name: Deploy dokumentasi API

on:
  push:
    branches: [main, master]
    paths:
      - "docs/api/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil sumber
        uses: actions/checkout@v4
      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5
      - name: Unggah dokumentasi statis
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - name: Publikasikan halaman
        id: deployment
        uses: actions/deploy-pages@v4
